# Splunk TA - Sample props.conf
# Test configuration for LogOnboard-AI TA Translator

[apache:access]
TIME_FORMAT = %d/%b/%Y:%H:%M:%S %z
TIME_PREFIX = \[
LINE_BREAKER = ([\r\n]+)
SHOULD_LINEMERGE = false
KV_MODE = none
EXTRACT-clientip = ^(?P<clientip>\S+)
EXTRACT-status = \s(?P<status>\d{3})\s
EXTRACT-bytes = \s(?P<bytes>\d+)$

[apache:error]
TIME_FORMAT = %a %b %d %H:%M:%S %Y
TIME_PREFIX = \[
LINE_BREAKER = ([\r\n]+)
SHOULD_LINEMERGE = false
EXTRACT-level = \[(?P<level>\w+)\]
EXTRACT-pid = \[pid\s+(?P<pid>\d+)\]

[custom:metrics]
TIME_FORMAT = %Y-%m-%dT%H:%M:%S%z
SHOULD_LINEMERGE = false
KV_MODE = json
