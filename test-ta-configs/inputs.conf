# Splunk TA - Sample inputs.conf
# Test configuration for LogOnboard-AI TA Translator

[monitor:///var/log/apache2/access.log]
disabled = false
index = web
sourcetype = apache:access

[monitor:///var/log/apache2/error.log]
disabled = false
index = web
sourcetype = apache:error

[script://./bin/custom_metrics.sh]
disabled = false
index = metrics
sourcetype = custom:metrics
interval = 300

[tcp://9514]
sourcetype = syslog
index = syslog
disabled = false
