# Splunk TA - Sample transforms.conf
# Test configuration for LogOnboard-AI TA Translator

[extract_user_agent]
REGEX = "(?P<user_agent>[^"]+)"$
FORMAT = user_agent::$1
DEST_KEY = _meta

[extract_request_method]
REGEX = ^[^\s]+\s+\]\s+"(?P<method>\w+)
FORMAT = method::$1

[extract_uri]
REGEX = "\w+\s+(?P<uri>[^\s]+)\s+HTTP
FORMAT = uri::$1
